volumes:
  dockerdev-mysql8-volume:

services:
  db8:
    container_name: dockerdev-db8
    image: percona:8
    volumes:
      - ./conf.d/mysql8/my.cnf:/etc/my.cnf.d/development.cnf:ro
      - dockerdev-mysql8-volume:/var/lib/mysql:rw
    environment:
      - MYSQL_ROOT_PASSWORD
    ports:
      - 127.0.0.1:3306:3306